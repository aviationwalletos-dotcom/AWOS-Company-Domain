<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 | AWOS</title>
<link rel="icon" href="/assets/img/favicon.png" type="image/png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;background:#F8FAFC;color:#0F172A;
       font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all}
  .box{max-width:560px;margin:0 auto;padding:24px}
  .code{font-family:"JetBrains Mono",monospace;font-size:15px;color:#475569}
  h1{margin:12px 0 0;font-size:30px;line-height:1.3}
  p{color:#475569;line-height:1.7;margin:14px 0 28px}
  a{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:8px;
    background:#2563EB;color:#fff;font-weight:600;text-decoration:none}
  a:hover{background:#1D4ED8}
  a:focus-visible{outline:3px solid #2563EB;outline-offset:3px}
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>주소가 바뀌었거나 없는 페이지입니다. 홈에서 다시 찾아보세요.</p>
    <a href="/">홈으로 가기</a>
  </div>
</body>
</html>
